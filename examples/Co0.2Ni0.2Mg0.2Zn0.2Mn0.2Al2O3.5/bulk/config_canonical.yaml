# Canonical-ensemble EMC (NpT) of the bulk (Co0.2Ni0.2Mg0.2Zn0.2Mn0.2)Al2O3.5
# high-entropy spinel oxide: every replica keeps the nominal composition and
# the same oxygen-vacancy concentration, and the replicas only differ in
# temperature. Same lattice, population and potential as config.yaml.
#
#   catemc generate config_canonical.yaml
#   catemc run      config_canonical.yaml
#   catemc analyze  config_canonical.yaml
#
# Units: K, eV, angstrom, fs, bar. Paths are relative to this file.

name: Co0.2Ni0.2Mg0.2Zn0.2Mn0.2Al2O3.5_bulk_canonical
directory: .
ensemble: canonical
# X is a vacancy: one eighth of the oxygen sites of the spinel AB2O4 is empty.
composition: Co0.2Ni0.2Mg0.2Zn0.2Mn0.2Al2O3.5X0.5

# 2x2x2 supercell of the conventional spinel cell, scaled to a = 8.06 A.
# Co and Al of the cif file mark the metal sites that are decorated.
template:
  file: Al2CoO4.cif
  scale_cell: [8.06, 8.06, 8.06]
  repeat: [2, 2, 2]

# 4 temperatures x 6 replicas = 24 replicas
population:
  temperatures: [723, 823, 923, 1023]
  replicas_per_temperature: 6

# The repulsive potential removes close contacts before MACE is used.
calculators:
  - calculator: repulsive
    fmax: 0.5
  - calculator: mace_mp           # MACE-MPA-0, https://github.com/ACEsuit/mace
    model: medium-mpa-0
    dispersion: false
    device: cuda
    default_dtype: float64
    fmax: 0.05

fitness:
  md_timestep: 1
  md_taut: 500
  md_steps: 400
  md_write_interval: 10
  md_taup: 1000
  compressibility: 5.0e-5       # 1/bar
  neighbor_cutoff: 3.5

# No inter-replica swap: the composition of every replica is conserved.
emc:
  trim_generation: 100
  pressure: 1.01325             # bar
  md_generation: 10
  exchange_generation: 1
  crossover_rate: 0.1
  intraswap_rate: 0.9           # swaps unlike metals, and O with vacancies
  gpu_devices: [0]
  procs_per_device: 32
  traj_write_interval: 50
  verbose: true

run:
  total_steps: 5000

analysis:
  starting_step: 300
  ending_step: 1000
  sample_stride: 10
  trajectory: {replicas: [10]}
  diagnostics: true
  sro: {cutoff: 3.5, metal_only: true, use_energy_mask: true}
