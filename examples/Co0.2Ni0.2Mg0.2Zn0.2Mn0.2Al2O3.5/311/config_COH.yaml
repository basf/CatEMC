# CLI version of generate_initial_population_COH.py, get_internal_partition_functions.py,
# gcemc_run_COH.py and mbar_analysis_COH.py in this folder: grand-canonical EMC
# of the (Co0.2Ni0.2Mg0.2Zn0.2Mn0.2)Al2O3.5 (311) surface with C, O and H
# reservoirs (CO2 hydrogenation conditions).
#
#   catemc generate config_COH.yaml
#   catemc run      config_COH.yaml
#   catemc analyze  config_COH.yaml
#
# Run the bulk example in ../bulk first: it provides the chemical-potential
# differences between the metals (chemical_potentials.metals below).
#
# Units: K, eV, angstrom, fs, bar. Paths are relative to this file.

name: Co0.2Ni0.2Mg0.2Zn0.2Mn0.2Al2O3.5COH_311
directory: .
ensemble: grand_canonical
# Composition of the bulk reservoir. X is an oxygen vacancy.
composition: Co0.2Ni0.2Mg0.2Zn0.2Mn0.2Al2O3.5X0.5

template:
  file: template_Co0.2Ni0.2Mg0.2Zn0.2Mn0.2Al2O4_311_slab_mace_opt.traj

regions:
  fixed: {z_below: 18.8}

# 3 temperatures x 14 replicas = 42 replicas. Three groups of starting
# structures with different oxygen-vacancy concentrations, each covered by a
# random adlayer of one adsorbate species.
population:
  temperatures: [623, 723, 823]
  replicas_per_temperature: 14
  round_decimals: 3
  adsorbate_species: [O, H, OH, CO, CO2, CH, CH2, CH3]
  max_adsorbate_species: 1
  variants:
    - {size: 14}                                # oxygen lattice of the template
    - {size: 14, nonmetals: {O: 20, X: 1}}
    - {size: 14, nonmetals: {O: 10, X: 1}}

calculators:
  - calculator: repulsive
    fmax: 0.5
  - calculator: mace_mp           # MACE-MPA-0, https://github.com/ACEsuit/mace
    model: medium-mpa-0
    dispersion: false
    device: cuda
    default_dtype: float64
    fmax: 0.05

fitness:
  md_timestep: 1
  md_taut: 500
  md_steps: 400
  md_write_interval: 10
  neighbor_cutoff: 2.5

adsorbates:
  species: [O, H, OH, CO, CO2, C, CH, CH2, CH3]
  other_species: [OH2, H2, O2, O2H, OOH, COH, CHO]
  gas_height: 17.5
  internal:
    C: {degeneracy: 3, symmetry_number: 1}
    O: {degeneracy: 3, symmetry_number: 1}
    H: {degeneracy: 2, symmetry_number: 1}
    CO: {degeneracy: 1, symmetry_number: 1}
    CO2: {degeneracy: 1, symmetry_number: 2}
    OH: {degeneracy: 2, symmetry_number: 1}
    OH2: {degeneracy: 1, symmetry_number: 2}
    H2: {degeneracy: 1, symmetry_number: 2}
    O2: {degeneracy: 1, symmetry_number: 2}
    OOH: {degeneracy: 2, symmetry_number: 1}
    O2H: {degeneracy: 2, symmetry_number: 1}
    COH: {degeneracy: 2, symmetry_number: 1}
    CHO: {degeneracy: 2, symmetry_number: 1}
    CH: {degeneracy: 2, symmetry_number: 1}
    CH2: {degeneracy: 3, symmetry_number: 1}
    CH3: {degeneracy: 2, symmetry_number: 3}

# References: graphite energy per atom for C, E(O2)/2 and E(H2)/2 (PBE total
# energies incl. zero-point energy) for O and H.
chemical_potentials:
  metals: ../bulk/Co0.2Ni0.2Mg0.2Zn0.2Mn0.2Al2O3.5_bulk_mbar_dmu_estimates.pkl
  elements:
    C: {reference: -9.944, range: [0.0, 2.0], step: 0.1}
    O: {reference: -4.3335, range: [-4.0, -3.0], step: 0.1}     # (-8.768 + 0.101) / 2
    H: {reference: -3.253, range: [-1.0, 0.0], step: 0.1}       # (-6.773 + 0.267) / 2

emc:
  trim_generation: 100
  md_generation: 10
  mu_walk_generation: 1
  exchange_generation: 1
  bias_starting_step: 300
  mbar_starting_step: 100
  mbar_sample_stride: 10
  crossover_rate: 0.2
  interswap_rate: 0.1
  slab_intraswap_rate: 0.15
  slab_mutation_rate: 0.15
  adsorbate_insertion_rate: 0.1
  adsorbate_removal_rate: 0.1
  adsorbate_displacement_rate: 0.1
  adsorbate_mutation_rate: 0.1
  adsorbate_surface_dmax: 2.5
  adsorbate_adsorbate_dmin: 2.0
  max_adsorbate_species: 3
  max_adsorbate_coverage: 1.0
  ignore_sites: bridge
  gpu_devices: [0]
  procs_per_device: 32
  traj_write_interval: 50
  verbose: true

run:
  total_steps: 2000

analysis:
  starting_step: 500
  ending_step: 2000
  sample_stride: 50
  vacancy_species: [O]
  trajectory: {replicas: [10]}
  # Early-stage and equilibrium conditions at 723 K. mu_C and mu_O are
  # absolute chemical potentials, the H value is relative to its reference.
  conditions:
    - {C: -8.766, O: -7.811, H: -0.5, T: 723, absolute: [C, O]}
    - {C: -9.241, O: -7.605, H: -0.5, T: 723, absolute: [C, O]}
  expectations:
    step: {C: 0.05, O: 0.025}
  fes:
    bin_width: 0.05
