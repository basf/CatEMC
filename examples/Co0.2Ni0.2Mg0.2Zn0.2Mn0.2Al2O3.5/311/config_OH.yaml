# CLI version of generate_initial_population_OH.py, get_internal_partition_functions.py,
# gcemc_run_OH.py and mbar_analysis_OH.py in this folder: grand-canonical EMC
# of the (Co0.2Ni0.2Mg0.2Zn0.2Mn0.2)Al2O3.5 (311) surface under H2-reduction
# conditions (O and H reservoirs).
#
#   catemc generate config_OH.yaml
#   catemc run      config_OH.yaml
#   catemc analyze  config_OH.yaml
#
# Run the bulk example in ../bulk first: it provides the chemical-potential
# differences between the metals (chemical_potentials.metals below).
#
# Units: K, eV, angstrom, fs, bar. Paths are relative to this file.

name: Co0.2Ni0.2Mg0.2Zn0.2Mn0.2Al2O3.5OH_311
directory: .
ensemble: grand_canonical
# Composition of the bulk reservoir. X is an oxygen vacancy.
composition: Co0.2Ni0.2Mg0.2Zn0.2Mn0.2Al2O3.5X0.5

# Relaxed, stoichiometric (311) slab of the spinel
template:
  file: template_Co0.2Ni0.2Mg0.2Zn0.2Mn0.2Al2O4_311_slab_mace_opt.traj

# Atoms below z = 18.8 A are frozen. Above, metals can mutate and lattice
# oxygen can turn into vacancies (and back).
regions:
  fixed: {z_below: 18.8}

# 14 replicas at 1023 K. Three groups of starting structures with different
# oxygen-vacancy concentrations in the mutable region, each covered by a
# random adlayer of up to three of the adsorbate species.
population:
  temperatures: [1023]
  replicas_per_temperature: 14
  round_decimals: 2
  adsorbate_species: [O, H, OH]
  max_adsorbate_species: 3
  variants:
    - {size: 4}                                 # oxygen lattice of the template
    - {size: 5, nonmetals: {O: 20, X: 1}}
    - {size: 5, nonmetals: {O: 10, X: 1}}

# Pre-relaxation with a repulsive potential, then the MACE-MPA-0 foundation
# model.
calculators:
  - calculator: repulsive
    fmax: 0.5
  - calculator: mace_mp           # MACE-MPA-0, https://github.com/ACEsuit/mace
    model: medium-mpa-0
    dispersion: false
    device: cuda
    default_dtype: float64
    fmax: 0.05

fitness:
  md_timestep: 1
  md_taut: 500
  md_steps: 400
  md_write_interval: 10
  neighbor_cutoff: 2.5

adsorbates:
  species: [O, H, OH]                       # fragments that are inserted and removed
  other_species: [OH2, H2, O2, O2H, OOH]    # fragments that can form during MD
  gas_height: 17.5                          # accessible volume = cell area x 17.5 A - metal spheres
  # Internal partition functions Q_int = g0 * Q_rot of the rigid fragments
  # (electronic degeneracy g0 and rotational symmetry number sigma).
  internal:
    O: {degeneracy: 3, symmetry_number: 1}
    H: {degeneracy: 2, symmetry_number: 1}
    OH: {degeneracy: 2, symmetry_number: 1}
    OH2: {degeneracy: 1, symmetry_number: 2}
    H2: {degeneracy: 1, symmetry_number: 2}
    O2: {degeneracy: 1, symmetry_number: 2}
    OOH: {degeneracy: 2, symmetry_number: 1}
    O2H: {degeneracy: 2, symmetry_number: 1}

# mu_O = reference + dmu_O and mu_H = reference + dmu_H, with the references
# E(O2)/2 and E(H2)/2 (PBE total energies incl. zero-point energy).
# y2x is the non-metal to metal ratio y/x of the bulk MxOy: 3.5/3 for oxygen
# (taken from the composition when omitted).
chemical_potentials:
  metals: ../bulk/Co0.2Ni0.2Mg0.2Zn0.2Mn0.2Al2O3.5_bulk_mbar_dmu_estimates.pkl
  elements:
    O: {reference: -4.3335, range: [-5.0, -3.0], step: 0.1}     # (-8.768 + 0.101) / 2
    H: {reference: -3.253, range: [-1.0, 0.0], step: 0.05}      # (-6.773 + 0.267) / 2

emc:
  trim_generation: 100
  md_generation: 10
  mu_walk_generation: 1
  exchange_generation: 1
  bias_starting_step: 300
  mbar_starting_step: 100
  mbar_sample_stride: 10
  crossover_rate: 0.2
  interswap_rate: 0.1
  slab_intraswap_rate: 0.15
  slab_mutation_rate: 0.15
  adsorbate_insertion_rate: 0.1
  adsorbate_removal_rate: 0.1
  adsorbate_displacement_rate: 0.1
  adsorbate_mutation_rate: 0.1
  adsorbate_surface_dmax: 2.5
  adsorbate_adsorbate_dmin: 2.0
  max_adsorbate_species: 3
  max_adsorbate_coverage: 1.0
  ignore_sites: bridge
  gpu_devices: [0]
  procs_per_device: 32
  traj_write_interval: 50
  verbose: true

run:
  total_steps: 4000

analysis:
  starting_step: 500
  ending_step: 4000
  sample_stride: 50
  vacancy_species: [O]              # report the lattice-oxygen vacancy fraction
  trajectory: {replicas: [10]}
  # H2-reduction condition at 1023 K, given as absolute chemical potentials
  conditions:
    - {O: -8.821, H: -3.981, T: 1023, absolute: true}
  # Surface phase diagram on a finer grid
  expectations:
    step: {O: 0.02, H: 0.01}
  # Free-energy surface at the condition listed above
  fes:
    bin_width: 0.05
