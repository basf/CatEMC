# CLI version of generate_initial_population.py, get_internal_partition_functions.py,
# gcemc_run.py and mbar_analysis.py in this folder: grand-canonical EMC of the
# Co0.25Mo0.45Fe0.1Ni0.1Cu0.1(111) surface under ammonia-decomposition
# conditions (N and H reservoirs).
#
#   catemc generate config.yaml
#   catemc run      config.yaml
#   catemc analyze  config.yaml
#
# Run the bulk example in ../bulk first: it provides the chemical-potential
# differences between the metals (chemical_potentials.metals below).
#
# Units: K, eV, angstrom, fs, bar. Paths are relative to this file.

name: Co0.25Mo0.45Fe0.1Ni0.1Cu0.1NH_111
directory: .
ensemble: grand_canonical
composition: Co0.25Mo0.45Fe0.1Ni0.1Cu0.1      # composition of the bulk reservoir

# 6x6 fcc(111) slab with 6 layers (216 atoms) in a 35 A high cell, randomly
# decorated at the bulk composition and relaxed with the last calculator.
# (The Python script uses a special quasi-random structure for the two fixed
# bottom layers instead; to reuse a slab prepared that way, replace "build",
# "cell_height", "randomize" and "relax" by "file: my_relaxed_slab.traj".)
template:
  build: {function: fcc111, symbol: Cu, a: 3.776, size: [6, 6, 6], vacuum: 10.0, orthogonal: false}
  cell_height: 35.0
  randomize: true
  relax: {fmax: 0.01, steps: 300}

# The two bottom layers are frozen. All other metal atoms can move and mutate.
regions:
  fixed: {z_below: 15.0}

# 4 temperatures x 14 replicas = 56 replicas. At every temperature two
# replicas start from the clean surface and twelve from a random adlayer of
# N, H or NH, so that the starting coverages span the whole range.
# (The Python script uses ordered adlayers at chosen coverages; a population
# built that way can be used with "file: my_input_pop.traj".)
population:
  temperatures: [573, 673, 773, 873]
  replicas_per_temperature: 14
  seed: 1234
  round_decimals: 2
  max_adsorbate_species: 1
  variants:
    - {size: 8, adsorbate_species: []}
    - {size: 48, adsorbate_species: [N, H, NH]}

calculators:
  - calculator: mace_mp           # MACE-MPA-0, https://github.com/ACEsuit/mace
    model: medium-mpa-0
    dispersion: false
    device: cuda
    default_dtype: float64
    fmax: 0.05

fitness:
  md_timestep: 1
  md_taut: 500
  md_steps: 400
  md_write_interval: 10
  neighbor_cutoff: 2.5

adsorbates:
  species: [N, H, NH, NH2, N2]      # fragments that are inserted and removed
  other_species: [NH3, H2]          # fragments that can form during MD
  gas_height: 15.0                  # accessible volume = cell area x 15 A - metal spheres
  # Internal partition functions Q_int = g0 * Q_rot of the rigid fragments
  # (electronic degeneracy g0 and rotational symmetry number sigma).
  internal:
    N: {degeneracy: 4, symmetry_number: 1}
    H: {degeneracy: 2, symmetry_number: 1}
    NH: {degeneracy: 2, symmetry_number: 1}
    NH2: {degeneracy: 2, symmetry_number: 2}
    N2: {degeneracy: 1, symmetry_number: 2}
    NH3: {degeneracy: 1, symmetry_number: 3}
    H2: {degeneracy: 1, symmetry_number: 2}

# mu_N = reference + dmu_N and mu_H = reference + dmu_H, with the references
# E(N2)/2 and E(H2)/2 (PBE total energies incl. zero-point energy, the
# functional of the MACE-MPA-0 training data).
chemical_potentials:
  metals: ../bulk/Co0.25Mo0.45Fe0.1Ni0.1Cu0.1_bulk_mbar_dmu_estimates.pkl
  elements:
    N: {reference: -8.2425, range: [-1.0, 0.0], step: 0.05}    # (-16.640 + 0.155) / 2
    H: {reference: -3.253, range: [-1.0, 0.0], step: 0.05}     # (-6.773 + 0.267) / 2

emc:
  trim_generation: 100
  md_generation: 10
  mu_walk_generation: 1
  exchange_generation: 1
  bias_starting_step: 300
  mbar_starting_step: 100
  mbar_sample_stride: 10
  crossover_rate: 0.2
  interswap_rate: 0.1
  slab_intraswap_rate: 0.15
  slab_mutation_rate: 0.15
  adsorbate_insertion_rate: 0.1
  adsorbate_removal_rate: 0.1
  adsorbate_displacement_rate: 0.1
  adsorbate_mutation_rate: 0.1
  adsorbate_surface_dmax: 2.5
  adsorbate_adsorbate_dmin: 2.0
  max_adsorbate_species: 3
  max_adsorbate_coverage: 1.0
  ignore_sites: bridge
  gpu_devices: [0]
  procs_per_device: 32
  traj_write_interval: 50
  verbose: true

run:
  total_steps: 2000

analysis:
  starting_step: 500
  ending_step: 2000
  sample_stride: 50
  z_surf: 22.0                      # atoms above this height are surface atoms
  trajectory: {replicas: [10]}
  # Early-stage and equilibrium ammonia decomposition at 800 K, given as
  # absolute chemical potentials mu_N and mu_H.
  conditions:
    - {N: -8.579, H: -3.960, T: 800, absolute: true}
    - {N: -9.167, H: -3.881, T: 800, absolute: true}
  # Surface phase diagram: reweight to a finer grid and to 800 K
  expectations:
    step: {N: 0.025, H: 0.025}
    temperatures: [800]
  # Free-energy surfaces at the two conditions listed above
  fes:
    bin_width: 0.05
