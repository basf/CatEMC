name: build-and-deploy-docs
on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinx-wagtail-theme ghp-import sphinx-autodoc-typehints sphinxcontrib-programoutput

      - name: Generate API docs
        run: sphinx-apidoc -o docs/source/ catemc

      - name: Build docs
        run: |
          cd docs
          make html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html

